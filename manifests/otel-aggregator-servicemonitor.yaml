# Tells OpenShift's user-workload-monitoring Prometheus to scrape the aggregator
# collector's /metrics endpoint. Requires manifests/cluster-monitoring-config.yaml
# applied first (user-workload monitoring must be enabled, or there is no Prometheus
# Operator here to reconcile this CRD).
#
# Apply: oc apply -f manifests/otel-aggregator-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-aggregator
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: otel-aggregator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: otel-aggregator
  namespaceSelector:
    matchNames:
      - mcp-gateway
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
