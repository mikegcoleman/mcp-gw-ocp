# OpenShift Template for the GatewayServiceConfig CR.
# Apply with `oc process` (built into oc — no envsubst/python needed):
#
#   oc process -f gatewayserviceconfig.yaml \
#     -p VERSION="$VERSION" \
#     -p CLUSTER_DOMAIN="$CLUSTER_DOMAIN" \
#     | oc apply -f -
#
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: mcp-gateway-gwsvc
parameters:
  - name: VERSION
    description: gateway-service image tag, matching your chart release (e.g. 0.0.59)
    required: true
  - name: CLUSTER_DOMAIN
    description: >-
      Cluster ingress wildcard domain. Get it with:
      oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
    required: true
objects:
  - apiVersion: mcp.docker.com/v1alpha1
    kind: GatewayServiceConfig
    metadata:
      name: mcp-gw
      namespace: mcp-gateway
    spec:
      version: "${VERSION}"
      deploymentMode: customer-cloud-k8s
      image:
        repository: ghcr.io/docker/mcp-gateway-enterprise-releases/gateway-service
        pullPolicy: IfNotPresent
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: mcp-gw
      secretsRef:
        name: mcp-gateway-gateway-service    # <release>-gateway-service (rendered by the chart)
      # Metrics + logs export: the gateway's built-in OTel Collector sidecar can't send
      # customer metrics (plain Prometheus scrape) and customer logs (named OTLP exporter)
      # at once outside of tenantRouting - tenantRouting fans BOTH signals for a tenant to
      # one OTLP destination together. So we point tenantRouting at our own small
      # "aggregator" collector (helm release otel-aggregator), which fans out from there:
      # metrics -> its own /metrics scrape endpoint (OpenShift user-workload-monitoring
      # ServiceMonitor), logs -> Loki's native OTLP endpoint. tenantID "default" matches
      # the sidecar's authenticate() principal.tenant_id (GATEWAY_TENANT_ID, default
      # "default") so all traffic through this gateway routes here.
      observability:
        collector:
          enabled: true
          signals:
            metrics: true
            logs: true
            traces: false
          tenantRouting:
            enabled: true
            tenants:
              - tenantID: default
                type: otlphttp
                endpoint: "http://otel-aggregator-opentelemetry-collector.mcp-gateway.svc.cluster.local:4318"
                insecure: true
      # sidecar.enabled stays false even with Entra auth wired up (M2/M3): the Entra
      # sidecar runs as its own standalone Deployment (manifests/sidecar-deployment.yaml),
      # not as an operator-injected in-pod sidecar. dataPlane.pluginConfig below points
      # gateway_auth/oauth/policy at it directly.
      sidecar:
        enabled: false
      controlPlane:
        replicas: 1
        bootstrapUser: admin
        # REQUIRED even at replicas:1 — the CP always runs a provisioner that acquires a
        # lease named "<cr-name>-provisioner". The operator only creates the lease Role/
        # RoleBinding for the gateway SA when leaderElection is enabled with the k8s-lease
        # backend. Without this, every MCPGateway hangs in `Creating` (the provisioner gets
        # `leases.coordination.k8s.io ... is forbidden`).
        leaderElection:
          enabled: true
          backend: k8s-lease
        # Public DP URL returned to MCP clients; matches the DP Route host (Step 9).
        dpExternalBasePath: "https://mcp-gw-dp.${CLUSTER_DOMAIN}"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      dataPlane:
        replicas: 1
        # Client→gateway auth: Entra JWTs validated by the standalone Entra sidecar,
        # plus per-user credential delegation, the OAuth broker (M3 team servers), and
        # the sidecar policy lane (M3 evaluate_policy). Supersedes the M1 bearer plugin.
        pluginConfig: |
          plugins:
            gateway_auth:
              provider: mcp
              server: "http://mcp-entra-sidecar.mcp-gateway.svc.cluster.local:8080/mcp"
            oauth:
              provider: mcp
              server: "http://mcp-entra-sidecar.mcp-gateway.svc.cluster.local:8080/mcp"
            policy:
              provider: mcp
              server: "http://mcp-entra-sidecar.mcp-gateway.svc.cluster.local:8080/mcp"
          auth_delegators:
            - name: entra-sidecar
              strategy: remote
              provider: mcp
              server: "http://mcp-entra-sidecar.mcp-gateway.svc.cluster.local:8080/mcp"
          auth_delegation:
            defaults:
              remote: entra-sidecar
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 2Gi
