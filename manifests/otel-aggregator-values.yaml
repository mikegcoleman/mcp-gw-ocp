# Helm values for open-telemetry/opentelemetry-collector (chart 0.172.1) — a small
# "aggregator" collector that receives OTLP from the gateway's built-in collector
# (via GatewayServiceConfig's observability.collector.tenantRouting, see
# gatewayserviceconfig.yaml) and fans out: metrics to a Prometheus-scrape endpoint,
# logs to Loki's native OTLP endpoint.
#
# See docs/observability.md for why this fan-out collector exists — the gateway can't
# do plain-Prometheus metrics and tenant-routed-OTLP logs at the same time on its own.
#
# Apply:
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm install otel-aggregator open-telemetry/opentelemetry-collector \
#     --version 0.172.1 -n mcp-gateway -f manifests/otel-aggregator-values.yaml
#
# Image tag pinned to match the chart's expected exporter-naming generation (0.159.0)
# — an older core-collector image (e.g. 0.127.0, as pulled by the gateway's own
# collector sidecar) rejects this chart's auto-rewritten `otlp_http` exporter type.
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector
  tag: "0.159.0"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

ports:
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889
    otlphttp/loki:
      endpoint: http://loki.mcp-gateway.svc.cluster.local:3100/otlp
      tls:
        insecure: true
  extensions:
    health_check: {}
  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/loki]
      traces: null
