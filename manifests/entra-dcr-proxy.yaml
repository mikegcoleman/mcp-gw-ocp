# OpenShift Template for the Entra DCR Proxy.
# Bridges RFC 7591 Dynamic Client Registration to Entra ID, enabling MCP clients
# (Claude Code, Claude Desktop, VS Code) to complete a full OAuth PKCE flow against
# Entra without pre-registering each client manually.
#
# Prerequisites:
#   - mcp-gateway-secrets exists with keys:
#       entra-tenant-id, dcr-proxy-client-id, dcr-proxy-client-secret, entra-app-client-id
#     (see docs/azure-setup.md §1h for where each value comes from)
#   - Milestone 2 sidecar is running
#
# RECOMMENDED — Helm install (handles Deployment, Service, Route, and prmOverride in one command):
#
#   helm install entra-dcr-proxy \
#     oci://ghcr.io/docker-pro-serv/charts/mcp-gateway-entra-dcr-proxy \
#     --version 0.1.4 \
#     --namespace mcp-gateway \
#     --set proxyBaseUrl=https://<GATEWAY_HOSTNAME>/dcr \
#     --set route.enabled=true \
#     --set route.host=<GATEWAY_HOSTNAME> \
#     --set prmOverride.enabled=true
#
# Raw manifest alternative (this file) — use if Helm is unavailable:
#
#   export CLUSTER_DOMAIN=$(oc get ingresses.config cluster -o jsonpath='{.spec.domain}')
#   oc process -f manifests/entra-dcr-proxy.yaml -p CLUSTER_DOMAIN="$CLUSTER_DOMAIN" \
#     | oc apply -n mcp-gateway -f -
#
# After applying, the proxy is reachable at:
#   https://mcp-gw-dp.<CLUSTER_DOMAIN>/dcr
# and serves Protected Resource Metadata at:
#   https://mcp-gw-dp.<CLUSTER_DOMAIN>/.well-known/oauth-protected-resource
#
# NOTE: runs one replica — client registrations are in-memory. Clients re-register
# automatically on pod restart (fully transparent to the user).
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: entra-dcr-proxy
parameters:
  - name: CLUSTER_DOMAIN
    description: >-
      Cluster ingress wildcard domain. Get it with:
      oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
    required: true
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: entra-dcr-proxy
      namespace: mcp-gateway
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: entra-dcr-proxy
      template:
        metadata:
          labels:
            app: entra-dcr-proxy
        spec:
          containers:
            - name: proxy
              image: ghcr.io/docker-pro-serv/mcp-gateway-entra-dcr-proxy:0.1.4
              ports:
                - containerPort: 8080
              env:
                - name: ENTRA_TENANT_ID
                  valueFrom:
                    secretKeyRef:
                      name: mcp-gateway-secrets
                      key: entra-tenant-id
                - name: PROXY_ENTRA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: mcp-gateway-secrets
                      key: dcr-proxy-client-id
                - name: PROXY_ENTRA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: mcp-gateway-secrets
                      key: dcr-proxy-client-secret
                - name: ENTRA_APP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: mcp-gateway-secrets
                      key: entra-app-client-id
                - name: PROXY_BASE_URL
                  value: "https://mcp-gw-dp.${CLUSTER_DOMAIN}/dcr"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8080
                initialDelaySeconds: 5
                periodSeconds: 30
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
  - apiVersion: v1
    kind: Service
    metadata:
      name: entra-dcr-proxy
      namespace: mcp-gateway
    spec:
      selector:
        app: entra-dcr-proxy
      ports:
        - port: 8080
          targetPort: 8080
  # /dcr paths — core proxy endpoints (register, token, authorize, health)
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: entra-dcr-proxy
      namespace: mcp-gateway
      annotations:
        haproxy.router.openshift.io/rewrite-target: /
    spec:
      host: "mcp-gw-dp.${CLUSTER_DOMAIN}"
      path: /dcr
      to:
        kind: Service
        name: entra-dcr-proxy
      port:
        targetPort: 8080
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  # prmOverride — proxy serves /.well-known/oauth-protected-resource directly so MCP clients
  # discover the DCR endpoint without any change to the gateway sidecar env.
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: entra-dcr-proxy-prm
      namespace: mcp-gateway
    spec:
      host: "mcp-gw-dp.${CLUSTER_DOMAIN}"
      path: /.well-known/oauth-protected-resource
      to:
        kind: Service
        name: entra-dcr-proxy
      port:
        targetPort: 8080
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
